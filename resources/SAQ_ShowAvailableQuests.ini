; Show Available Quests - 可选设置（放在 mod 目录里，删 mod 时会一起删掉）
; 改完保存，然后关闭并重新打开一次任务菜单即可生效（不用重启游戏）。
;
; ── 测试过滤（普通玩家保持 0 即可）──────────────────────────────
; Mode 取值：
;   0 = 关闭（默认，显示全部可接任务 + 任务板入口条目）
;   1 = 只显示「有引导目标」的任务（点了能出蓝点）
;   2 = 只显示「没有引导目标」的任务
;   3 = 只显示 DLC 任务
;   4 = 只显示「有引导目标 + 有具名地点」的任务（最少最好找）
;   5 = 只显示「无限任务入口」（任务板 13 条 + 可重复 NPC 8 条 + 可招募船员 24 条，共 45 条）
;       —— 验证入口条目的显示与引导（★ 第 156 轮起含船员；船员会按 P/A 判据过滤，见 [Filter] CrewCond）
;   6 = 只显示「需要靠近」的任务（全部候选都非常驻）—— 远处点「前往接取地点」会提示
;       「目标尚未加载」并等待你靠近（靠近后自动生效）；验证待生效 / HUD 提示 / 自动重试。
;       ★ 第 146 轮起为 0 条（最后 1 条 DLC 收集型任务也补上了 world 级常驻兜底）——
;       模式保留：新内容（DLC/更新）若再出现「候选全非常驻」的任务，用它一眼能筛出来。
; 控制台（如果你的游戏认 `set SAQ_TestMode to N`）非 0 时优先于本文件。
;
; ── 引擎内自动化测试（harness，第 49 轮；开发用，普通玩家保持 Harness=0）────────
; Harness=1 时，插件会读 Plan 指向的用例文件，在游戏里**自动执行**这些事：
;   自己造任务进度（Reset/Start/SetStage/CompleteQuest/传送）→ 自己开/关任务菜单 →
;   自己选中条目/按键 → 自己断言（日志 / 界面报告）→ 跑完把结果写到同目录的
;   SAQ_testresults.json（日志里也有 `harness：…` 行）。
;   ⇒ 判据不用每次人肉复现：启动一次游戏就自动跑完一批用例。
; ★ 改 0→1 不必重启游戏：插件每 2 秒复查一次本文件；0→1 会当场载入用例并开跑
;   （反向：跑到一半改成 0 不会中止本轮，改回 0 后再置 1 会重新载入用例再跑一遍）。
; ★ 会改任务状态 —— 请**先备份存档**，并且别在主力存档上跑。
; ★ 命令类步骤要「菜单关着」才会被脚本消化（Papyrus 定时器在菜单开着时冻结）。
;
; ★★ 注意：Harness / Plan 必须留在这个 [Test] 段里 —— 放到别的段（例如 [Filter]）
;    插件读不到（`GetPrivateProfileInt("Test", …)` 只认本段；实机踩过一次）。
; ★ Nexus 下载的发布版**不含 harness 编译**（这两个键不起作用）—— 要用 harness 请从源码
;   自行构建（tools\build-saq.ps1 -Harness）；装了发布版 DLL 却把 Harness 改成 1 时，
;   日志里会有一行 WARN 明确提示（不会静默）。
[Test]
Mode=0
Harness=0
Plan=SAQ_TestPlan.txt
; ★★ 第 62 轮：主菜单自动读档（harness 用）—— 存档名**子串**（大小写不敏感），空 = 关闭。
;   填了之后：启动游戏 → 按任意键到主菜单 → 插件**自动读这个存档**并自动开跑用例
;   （不填则要你手动读一个存档再等它开跑）。例：AutoLoad=Save1_FDBB7678M54696D6D6568_000034_20260922142854_2_0_4
AutoLoad=
;
; ---- 进度门槛过滤（第 35 轮，「游戏进度还不能让玩家接到就不显示」）----
; 判据 = 任务记录级条件里「引用别的任务」的 GetQuestRunning/GetQuestCompleted/GetStageDone
; 检查（覆盖 7 条任务 / 11 条条件，含条件组里的「或」逻辑）。
;   1 = 过滤（默认）；0 = 不过滤（只写日志，便于对照界面）
;
; ---- 对话条件过滤（第 48 轮·大项 D，「进度没到」的第二判据）----
; 判据 = 任务自己的对话（INFO）里「引用别的任务」的同类条件 —— 全部参与判定的对话
; 都「有已知为假的条件」⇒ 进度没到 ⇒ 不显示（覆盖 84 条任务 / 425 条对话 / 512 条
; 条件，含官方 DLC 与追踪者联盟；如「大器晚成」要「孤立无援」完成、「亲爱的姐妹」要
; 「FFConstantZ05」完成）。
;   1 = 过滤（默认）；0 = 只写日志（便于对照界面）
;
; ---- 任务链门槛（第 67 轮，「进度没到」的第三判据）----
; 势力线/主线那种「编号任务链」的后续任务只能由前一个任务的收尾阶段自动开始 ——
; 前置没做完时它们根本接不到，不该显示（如 CF02 菜鸟觐见要 CF01 深藏不露走到 stage 1000）。
;   1 = 过滤（默认）；0 = 只写日志（便于对照界面）
;
; ---- 可招募船员判据（第 156 轮，「可接任务」列表里的船员条目）----
; 判据 = 船员的 crew faction 运行时状态（游戏内直读）：
;   * 「可招募解锁」（P=1）才显示 —— 进度没到（未解锁）不显示；
;   * 已招募过的（A=1）不显示（已在你船员名单里，不用再提示）；
;   * 船员不在当前区域（引用未加载、读不到状态）⇒ 照常显示（判不了就不藏）。
;   1 = 过滤（默认）；0 = 全部显示（只写日志，便于对照界面）
[Filter]
ProgressCond=1
InfoCond=1
ChainCond=1
CrewCond=1
;
; ---- 界面形态（第 137 轮 · 无 SWF 覆盖的注入形态）----
; 我们的任务 tab 有两种实现：SWF 覆盖（随本 mod 安装）与「注入原版菜单」
; （不替换任何文件 —— 与其它改 missionmenu.swf 的 mod 不冲突）。
;   swf    = 只用 SWF 覆盖（行为与既有版本完全一致）；
;   auto   = （默认）SWF 优先：界面是我们的 SWF 时走 SWF；被其它 mod 覆盖 /
;            未安装或版本过旧时自动切「注入形态」（任务 tab 照常显示）；
;   inject = 只用注入形态（不推送 SWF）。
; ★ 改完保存，关开一次任务菜单生效（不用重启游戏）。
[UI]
UiMode=auto
;
; ── 日志文件大小上限（第 112 轮）──────────────────────────────
; 单位 MB：写新一行时若会超过就把旧内容整体清空（不是滚动保留旧文件）。
;   Nexus 发布包默认 1；开发构建部署默认 10 —— 想留更长的记录就改这个值。
[Log]
MaxSizeMB=1
