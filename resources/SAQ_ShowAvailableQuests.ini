; Show Available Quests - 可选设置（放在 mod 目录里，删 mod 时会一起删掉）
; 改完保存，然后关闭并重新打开一次任务菜单即可生效（不用重启游戏）。
;
; ── 测试过滤（普通玩家保持 0 即可）──────────────────────────────
; Mode 取值：
;   0 = 关闭（默认，显示全部可接任务 + 任务板入口条目）
;   1 = 只显示「有引导目标」的任务（点了能出蓝点）
;   2 = 只显示「没有引导目标」的任务
;   3 = 只显示 DLC 任务
;   4 = 只显示「有引导目标 + 有具名地点」的任务（最少最好找）
;   5 = 只显示「无限任务入口」（任务板，12 条）—— 验证任务板条目的显示与引导
;   6 = 只显示「需要靠近」的任务（候选全是非常驻引用，76 条；含「营救机器人」）
;       —— 验证第 46 轮：待生效 / HUD 提示 / 自动重试 / 靠近后自动生效
; 控制台（如果你的游戏认 `set SAQ_TestMode to N`）非 0 时优先于本文件。
[Test]
Mode=0

;
; ---- 进度门槛过滤（第 35 轮）----
; 「游戏进度还不能让玩家接到」的任务默认不显示（判据 = 任务记录级条件里
; 对别的任务的 GetQuestRunning/GetQuestCompleted/GetStageDone 检查；覆盖 7 条）。
;   1 = 过滤（默认）；0 = 不过滤（只写日志，便于对照界面）
[Filter]
ProgressCond=1
